name: Deploy Hugo Site to GitHub Pages

on:
  push:
    # ⚠️ 关键更改 1: 仅在推送到 main-hugo 分支时触发部署
    branches:
      - main-hugo 

permissions:
  contents: write # 授予写入权限，用于推送到 main 分支

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    env:
      HUGO_VERSION: '0.120.4' 
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # 检出 main-hugo 分支的代码
          ref: main-hugo 
          submodules: true 
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true 

      - name: Build Hugo Site
        run: |
          hugo \
            --minify \
            --baseURL "${{ secrets.BASEURL }}" \
            --config.params.comments.twikoo.envId "${{ secrets.TWIKOO_ENV_ID }}"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public 
          # ✅ 关键更改 2: 部署目标分支设置为 main
          # 这是因为您的仓库是 kaguranosoul.github.io，必须部署到 main 分支
          publish_branch: main 
          force_orphan: true